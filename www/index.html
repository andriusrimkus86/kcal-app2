<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#12171B">
<title>Kcal Log</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#F1F4F3;--surface:#FFFFFF;--surface2:#E6EBEA;--line:#D5DCDA;--text:#162026;--muted:#586871;
  --amber:#E39A2B;--amber-text:#8A4F00;--on-amber:#1A1100;
  --blue:#3FA5C0;--blue-text:#106177;--danger:#B73A2B;--rec:#6B4FB8;--rec-bg:#ECE7F8;--ok:#2C7A4B;--ok-bg:#E0F2E7;
  --font-d:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-b:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#12171B;--surface:#1B2228;--surface2:#242D34;--line:#2E3942;--text:#E8EEF1;--muted:#94A3AE;
    --amber:#EBAA4B;--amber-text:#F0B35A;--on-amber:#1A1100;
    --blue:#5DB9D2;--blue-text:#7CCBE0;--danger:#F28B7C;--rec:#B9A7F0;--rec-bg:#2A2540;--ok:#7BD59E;--ok-bg:#1D3A2A;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#12171B;--surface:#1B2228;--surface2:#242D34;--line:#2E3942;--text:#E8EEF1;--muted:#94A3AE;
  --amber:#EBAA4B;--amber-text:#F0B35A;--on-amber:#1A1100;
  --blue:#5DB9D2;--blue-text:#7CCBE0;--danger:#F28B7C;--rec:#B9A7F0;--rec-bg:#2A2540;--ok:#7BD59E;--ok-bg:#1D3A2A;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.45 var(--font-b);min-height:100vh}
body.lock{overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue-text);outline-offset:2px}
.wrap,#main{max-width:560px;margin:0 auto;padding:0 18px 96px}
body.t-today #main{padding-bottom:180px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:14px 0 10px}
h1{font:700 30px/1.05 var(--font-d);letter-spacing:-.02em;margin:0}
h2{font:700 22px/1.15 var(--font-d);letter-spacing:-.01em;margin:0}
.sub{margin:4px 0 0;color:var(--muted);font-size:14px}
.tools{display:flex;gap:6px;align-items:center}
.icon{width:42px;height:42px;display:grid;place-items:center;border:0;border-radius:12px;background:var(--surface2);color:var(--text)}
.link{border:0;background:none;color:var(--blue-text);padding:4px 0 10px;font-weight:600}

/* summary */
.sum{padding:6px 0 20px}
.big{display:flex;align-items:baseline;gap:8px}
.num{font:700 68px/1 var(--font-d);letter-spacing:-.035em;color:var(--amber-text);font-variant-numeric:tabular-nums}
.unit{font:500 20px var(--font-d);color:var(--muted)}
.meter{height:10px;border-radius:999px;background:var(--surface2);overflow:hidden;margin-top:10px}
.meter i{display:block;height:100%;background:var(--amber);border-radius:999px;transition:width .3s}
.meter.blue i{background:var(--blue)}
.note{margin:8px 0 18px;color:var(--muted);font-size:14px}
.prot{display:flex;justify-content:space-between;align-items:baseline;font-size:15px}
.prot b{font:700 18px var(--font-d);color:var(--blue-text);font-variant-numeric:tabular-nums}

/* lists */
.list{list-style:none;margin:0;padding:0;background:var(--surface);border-radius:16px;overflow:hidden}
.list li+li{border-top:1px solid var(--line)}
.row{display:flex;width:100%;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;min-height:60px;border:0;background:none;text-align:left}
.row .main,.row .vals{display:flex;flex-direction:column;min-width:0}
.row .vals{text-align:right;flex:none}
.row b{font-weight:600}
.row small{color:var(--muted);font-size:13px}
.row .k{font-family:var(--font-d);color:var(--amber-text);font-variant-numeric:tabular-nums}
.row small.p{color:var(--blue-text)}
.row.rec{box-shadow:inset 3px 0 0 var(--rec)}
.datebox{position:relative;display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--line);border-radius:12px;background:var(--surface);height:48px;padding:0 12px}
.datebox svg{color:var(--muted);flex:none}
.datebox input[type=date]{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;padding:0;cursor:pointer}
.chk{display:flex;align-items:flex-start;gap:12px;padding:10px 2px;font-size:15px}
.chk input{width:22px;height:22px;margin:0;flex:none;accent-color:var(--rec)}
.chip.on{background:var(--amber);color:var(--on-amber);border-color:var(--amber)}
.idea{background:var(--surface);border-radius:16px;padding:14px 16px;margin-bottom:10px}
.idea .it{display:block;font:700 18px var(--font-d);margin-bottom:8px}
.ing{list-style:none;margin:0 0 10px;padding:0}
.ing li{display:flex;justify-content:space-between;gap:12px;padding:3px 0;font-size:15px}
.ing em{font-style:normal;color:var(--muted);flex:none}
.itot{display:flex;gap:16px;margin-bottom:8px}
.itot b{font:700 18px var(--font-d);font-variant-numeric:tabular-nums}
.itot .k{color:var(--amber-text)}.itot .p{color:var(--blue-text)}
.how{margin:0 0 12px;color:var(--muted);font-size:14px}
.actrow{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.acts3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0 0 12px}
.acts3 .btn{padding:0 8px;min-height:46px;font-size:14px;gap:6px}
.star{color:var(--amber-text)}
.day.ok{background:var(--ok-bg)}
.day.ok:not(.today) .dn{color:var(--ok)}
.reader{width:100%;min-height:200px;background:#000;border-radius:12px;overflow:hidden;margin-bottom:8px}
.tag{display:inline-block;font-size:11px;font-weight:600;line-height:16px;padding:0 8px;margin-right:6px;border-radius:999px;background:var(--rec-bg);color:var(--rec)}
.grp{margin:18px 4px 8px;font:700 13px var(--font-b);color:var(--muted)}
.grp:first-child{margin-top:4px}
.empty{padding:28px 8px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--text);font:700 18px var(--font-d);margin-bottom:4px}
.empty p{margin:0}
.search{width:100%;height:46px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:0 14px;margin:0 0 12px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border:0;border-radius:12px;font-weight:600;background:var(--surface2);color:var(--text)}
.btn.primary{background:var(--amber);color:var(--on-amber)}
.btn.danger{background:none;color:var(--danger)}
.btn.ghost{background:var(--surface2)}
.btn.sm{min-height:42px;padding:0 14px}
.btn.wide{width:100%;margin-top:10px}

/* fab, nav */
.fab{position:fixed;z-index:10;right:max(16px,calc(50% - 264px));bottom:calc(76px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:8px;height:54px;padding:0 20px;border:0;border-radius:999px;background:var(--amber);color:var(--on-amber);font-weight:600;box-shadow:0 6px 18px rgba(0,0,0,.28)}
.nav{position:fixed;z-index:10;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav div{display:flex;max-width:560px;margin:0 auto}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;border:0;background:none;color:var(--muted);font-size:12px;font-weight:500}
.nav button.on{color:var(--amber-text)}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{font-size:11px;color:var(--muted);text-align:center;padding:4px 0}
.day{position:relative;aspect-ratio:1/1.25;border:0;border-radius:10px;background:var(--surface);padding:4px 2px 6px;display:flex;flex-direction:column;align-items:center;overflow:hidden;min-width:0}
.day.blank{background:none;pointer-events:none}
.dn{font-size:12px;font-weight:600;color:var(--muted);line-height:20px}
.day.today .dn{background:var(--amber);color:var(--on-amber);border-radius:999px;min-width:20px;padding:0 5px}
.dk{font:700 11px var(--font-d);color:var(--amber-text);margin-top:3px}
.dp{font-size:10px;color:var(--blue-text)}
.day i{position:absolute;left:0;bottom:0;height:3px;background:var(--amber)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0 6px}
.stats div{background:var(--surface);border-radius:12px;padding:10px 12px}
.stats dt{font-size:12px;color:var(--muted)}
.stats dd{margin:2px 0 0;font:700 18px var(--font-d);font-variant-numeric:tabular-nums}
.hint{color:var(--muted);font-size:13px;margin:8px 0 0}
.bmi{display:inline-block;font:700 12px/20px var(--font-b);padding:0 8px;margin-left:6px;border-radius:999px;vertical-align:middle;white-space:nowrap}
.bmi.g{background:var(--ok-bg);color:var(--ok)}
.bmi.y{background:rgba(235,170,75,.22);color:var(--amber-text)}
.bmi.r{background:rgba(214,69,50,.2);color:var(--danger)}
.bmi.b{background:var(--rec-bg);color:var(--rec)}
.prog{background:var(--surface);border-radius:16px;padding:14px 16px;margin-top:16px}
.prog h3{margin:0 0 10px;font:700 16px var(--font-d)}
.prog .meter{height:14px;margin:6px 0 4px}
.prog .pct{display:flex;justify-content:space-between;align-items:baseline}
.prog .pct b{font:700 28px var(--font-d);color:var(--amber-text);font-variant-numeric:tabular-nums}
.prog dl{display:grid;grid-template-columns:1fr auto;gap:6px 12px;margin:12px 0 0}
.prog dt{color:var(--muted);font-size:14px}
.prog dd{margin:0;text-align:right;font:700 16px var(--font-d);font-variant-numeric:tabular-nums}
.prog .sep{border-top:1px solid var(--line);margin-top:12px;padding-top:2px}

/* weight */
.wform{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:end;margin-bottom:6px}
.wform .btn{grid-column:1/-1}
.chart{width:100%;height:auto;margin:14px 0 8px;display:block}
.chart path{fill:none;stroke:var(--amber);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart circle{fill:var(--amber)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--muted);font-size:10px}
.delta{color:var(--muted);font-size:13px}
.x{border:0;background:none;color:var(--muted);width:40px;height:40px;display:grid;place-items:center;border-radius:10px;flex:none}
.wrow{display:flex;align-items:center;gap:8px;padding:6px 8px 6px 16px;min-height:56px}
.wrow .main{flex:1;display:flex;flex-direction:column}
.wrow .kg{font:700 18px var(--font-d);font-variant-numeric:tabular-nums}

/* sheet */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.55)}
.sheet{position:fixed;z-index:21;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;max-height:90vh;max-height:90dvh;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.field{display:block;margin:0 0 12px}
.field>span{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
.inp{display:flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 14px;min-height:48px}
.inp input{flex:1;min-width:0;border:0;background:none;outline:0;height:46px;font-size:18px}
.inp em{font-style:normal;color:var(--muted);margin-left:8px}
.inp:focus-within{border-color:var(--blue-text)}
input[type=date]{border:1px solid var(--line);border-radius:12px;background:var(--surface);height:48px;padding:0 10px;width:100%;min-width:0}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.two.stack{grid-template-columns:minmax(0,1fr);gap:0}
.sheet{overflow-x:hidden}
.wlinks{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;min-height:42px;border:0;border-radius:9px;background:none;color:var(--muted);font-weight:600}
.seg button.on{background:var(--surface);color:var(--text)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 14px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;min-height:40px}
.preview{display:flex;gap:18px;align-items:baseline;padding:14px 16px;background:var(--surface);border-radius:14px;min-height:56px}
.preview b{font:700 22px var(--font-d);font-variant-numeric:tabular-nums}
.preview .k{color:var(--amber-text)}.preview .p{color:var(--blue-text)}
.muted{color:var(--muted)}
.err{min-height:20px;margin:8px 0 0;color:var(--danger);font-size:14px}
.err.ok{color:var(--blue-text)}
textarea{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:10px 12px;resize:vertical}
.warn{background:var(--danger);color:#fff;padding:8px 16px;font-size:14px;text-align:center}

/* toast */
#toast{position:fixed;z-index:30;left:50%;bottom:calc(142px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);opacity:0;pointer-events:none;display:flex;align-items:center;gap:14px;background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;transition:opacity .2s,transform .2s;max-width:92vw}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{border:0;background:none;color:var(--amber);font-weight:700;padding:4px 2px}
.mscrim{position:fixed;inset:0;z-index:22}
.menu{position:fixed;z-index:23;top:calc(env(safe-area-inset-top,0px) + 64px);right:max(12px,calc(50% - 268px));min-width:230px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.menu button{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;padding:0 12px;border:0;border-radius:10px;background:none;text-align:left;font-weight:500}
.menu button:hover,.menu button:focus-visible{background:var(--surface2)}
.menu svg{color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="notice"></div>
<main id="main"></main>
<button class="fab" id="fab" data-act="open-add" hidden aria-label="Add food"></button>
<nav class="nav" aria-label="Pages"><div id="navbar"></div></nav>
<div id="sheet-root"></div>
<div id="menu-root"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';
var KEY='kcal-log-v1';
var $=function(s){return document.querySelector(s);};
var esc=function(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};
var uid=function(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);};
var pad=function(n){return String(n).padStart(2,'0');};
var ymd=function(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};
var parseYmd=function(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);};
var todayStr=function(){return ymd(new Date());};
var num=function(v){var n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:NaN;};
var r1=function(n){return Math.round(n*10)/10;};
var r3=function(n){return Math.round(n*1000)/1000;};
var fmtK=function(n){return Math.round(n).toLocaleString('en-GB');};
var fmtP=function(n){return (Math.round(n*10)/10).toLocaleString('en-GB',{maximumFractionDigits:1});};
var longDate=function(s){return s;};
var LOC=function(){return db&&db.lang==='lt'?'lt-LT':'en-GB';};
var capFirst=function(s){return s.charAt(0).toUpperCase()+s.slice(1);};

/* ---------- icons ---------- */
var I={
 plus:'<path d="M5 12h14M12 5v14"/>',
 x:'<path d="M18 6 6 18M6 6l12 12"/>',
 left:'<path d="m15 18-6-6 6-6"/>',
 right:'<path d="m9 18 6-6-6-6"/>',
 today:'<path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/>',
 calendar:'<rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
 foods:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
 weight:'<circle cx="12" cy="5" r="3"/><path d="M6.5 8a2 2 0 0 0-1.905 1.46L2.1 18.5A2 2 0 0 0 4 21h16a2 2 0 0 0 1.925-2.54L19.4 9.5A2 2 0 0 0 17.48 8Z"/>',
 sliders:'<path d="M21 4h-7M10 4H3M21 12h-9M8 12H3M21 20h-5M12 20H3M14 2v4M8 10v4M16 18v4"/>',
 trash:'<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/>',
 menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',
 upload:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5"/><path d="M12 3v12"/>',
 copy:'<rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>',
 scan:'<path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M8 7v10"/><path d="M12 7v10"/><path d="M16 7v10"/>',
 zap:'<path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/>',
 shuffle:'<path d="M2 18h1.4c1.3 0 2.5-.6 3.3-1.7l6.1-8.6c.7-1.1 2-1.7 3.3-1.7H22"/><path d="m18 2 4 4-4 4"/><path d="M2 6h1.9c1.5 0 2.9.9 3.6 2.2"/><path d="M22 18h-5.9c-1.3 0-2.6-.7-3.3-1.8l-.5-.8"/><path d="m18 14 4 4-4 4"/>',
 idea:'<path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/>',
 chart:'<path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/>',
 recipe:'<path d="M6 13.87A4 4 0 0 1 7.41 6a5.11 5.11 0 0 1 1.05-1.54 5 5 0 0 1 7.08 0A5.11 5.11 0 0 1 16.59 6 4 4 0 0 1 18 13.87V21H6Z"/><path d="M6 17h12"/>'
};
var svg=function(n,s){s=s||22;return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+I[n]+'</svg>';};

/* ---------- data ---------- */
function defaults(){return{
 foods:[
  {id:uid(),name:'Oats, dry',unit:'g',kcal:370,protein:13},
  {id:uid(),name:'Chicken breast, cooked',unit:'g',kcal:165,protein:31},
  {id:uid(),name:'Egg, large',unit:'portion',kcal:72,protein:6.3}
 ],entries:[],weights:[],recipes:[],goals:{kcal:2200,protein:130,maint:3200},theme:'system',lang:'en',rem:{on:false,time:'20:00',week:false}};}
function normalize(d){var b=defaults();return{

var scanner=null,scanLib=null;
function scanMsg(m){var e=$('#scan-msg');if(e)e.textContent=m;}
function loadScanner(){
 if(window.Html5Qrcode)return Promise.resolve();
 if(scanLib)return scanLib;
 scanLib=new Promise(function(res,rej){
  var sc=document.createElement('script');
  sc.src='https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8';
  sc.onload=res;
  sc.onerror=function(){scanLib=null;rej(new Error('load'));};
  document.head.appendChild(sc);
 });
 return scanLib;
}
function stopScan(){
 var h=scanner;scanner=null;
 if(!h)return Promise.resolve();
 return h.stop().then(function(){try{h.clear();}catch(e){}}).catch(function(){});
}
function nativeScanner(){return window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.BarcodeScanner;}
async function nativeScan(BS){
 try{
  var av=await BS.isGoogleBarcodeScannerModuleAvailable();
  if(!av.available){
   scanMsg('Installing the Google scanner module, this takes a minute. Then tap Scan again.');
   await BS.installGoogleBarcodeScannerModule();
   return;
  }
  var r=await BS.scan({formats:['Ean13','Ean8','UpcA','UpcE']});
  var b=r&&r.barcodes&&r.barcodes[0];
  if(b&&(b.rawValue||b.displayValue))lookupCode(b.rawValue||b.displayValue);
  else scanMsg('No barcode was read. Try again, or type the number.');
 }catch(e){
  var m=String(e&&e.message||e);
  if(/cancel/i.test(m))scanMsg('Scan cancelled. Tap Look up after typing a number, or close and try again.');
  else scanMsg('The scanner failed ('+m+'). Type the barcode number instead.');
 }
}
function startScan(){
 var BS=nativeScanner();
 if(BS){var rd=$('#reader');if(rd)rd.style.display='none';scanMsg('Opening the scanner...');nativeScan(BS);return;}
 loadScanner().then(function(){
  if(!ui.sheet||ui.sheet.type!=='scan'||!window.Html5Qrcode)return;
  var h=new Html5Qrcode('reader'),F=Html5QrcodeSupportedFormats;
  scanner=h;
  return h.start({facingMode:'environment'},{fps:10,qrbox:{width:260,height:140},formatsToSupport:[F.EAN_13,F.EAN_8,F.UPC_A,F.UPC_E]},
   function(text){stopScan().then(function(){lookupCode(text);});},function(){})
   .catch(function(err){scanner=null;scanMsg('The camera could not start ('+(err&&err.message||err)+'). Type the barcode number instead.');});
 }).catch(function(){scanMsg('The scanner could not be loaded. Check your connection, or type the barcode number below.');});
}
async function lookupCode(code){
 code=String(code).replace(/\D/g,'');
 if(code.length<8){scanMsg('Enter the 8 to 13 digits under the barcode.');return;}
 var back=ui.sheet&&ui.sheet.type==='scan'?ui.sheet.back:null;
 scanMsg('Looking up '+code+'...');
 try{
  var res=await fetch('https://world.openfoodfacts.org/api/v2/product/'+code+'.json?fields=product_name,brands,nutriments,serving_quantity');
  var d=await res.json();
  var p=(d&&d.status===1&&d.product)?d.product:null;
  var n=p&&p.nutriments?p.nutriments:{};
  var kcal=Number(n['energy-kcal_100g']);
  if(!(kcal>=0)&&Number(n['energy_100g'])>=0)kcal=Number(n['energy_100g'])/4.184;
  var prot=Number(n['proteins_100g']);
  var brand=p&&p.brands?String(p.brands).split(',')[0].trim():'';
  var name=p&&p.product_name?String(p.product_name).trim()+(brand?' ('+brand+')':''):'';
  var serv=p?Number(p.serving_quantity):0;
  ui.sheet={type:'food',id:null,name:name,unit:'g',kcal:kcal>=0?String(r1(kcal)):'',protein:prot>=0?String(r1(prot)):'',pg:serv>0?String(Math.round(serv)):'',rec:false,lock:false,fav:false,back:back};
  renderSheet();
  toast(p?(kcal>=0?'Found it. Check the values and save.':'Found the name, but no calories. Enter them by hand.'):'Product not found. Enter it by hand.');
 }catch(e){scanMsg('Could not reach Open Food Facts. Check your connection.');}
}

function remPlugin(){return window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.LocalNotifications;}
async function scheduleReminder(on,time,quiet){
 var LN=remPlugin();
 if(!LN){if(!quiet)remMsg('Reminders work in the installed app only.');return;}
 try{
  await LN.cancel({notifications:[{id:1}]});
  if(!on){if(!quiet)remMsg('Reminder turned off.',true);return;}
  var perm=quiet?await LN.checkPermissions():await LN.requestPermissions();
  if(perm.display!=='granted'){if(!quiet)remMsg('Notifications are blocked. Allow them for Kcal Log in the Android settings.');return;}
  var p=String(time).split(':');
  await LN.schedule({notifications:[{id:1,title:'Kcal Log',body:'Time to log your meals and your weight.',schedule:{on:{hour:Number(p[0]),minute:Number(p[1])}}}]});
  if(!quiet)remMsg('Reminder set for '+time+' every day.',true);
 }catch(e){if(!quiet)remMsg('Could not set the reminder: '+(e&&e.message||e));}
}
async function scheduleWeekly(on,quiet){
 var LN=remPlugin();
 if(!LN){if(!quiet&&on)remMsg('Reminders work in the installed app only.');return;}
 try{
  await LN.cancel({notifications:[{id:2}]});
  if(!on)return;
  var perm=quiet?await LN.checkPermissions():await LN.requestPermissions();
  if(perm.display!=='granted'){if(!quiet)remMsg('Notifications are blocked. Allow them for Kcal Log in the Android settings.');return;}
  await LN.schedule({notifications:[{id:2,title:'Kcal Log',body:'Your weekly summary is ready.',schedule:{on:{weekday:1,hour:19,minute:0},allowWhileIdle:true}}]});
  if(!quiet)remMsg('Weekly reminder set for Sunday 19:00.',true);
 }catch(e){if(!quiet)remMsg('Could not set the weekly reminder: '+(e&&e.message||e));}
}

var LT_RE=[
 [/^(\d[\d,.]*) kcal left of (\d[\d,.]*)$/,'liko $1 kcal iš $2'],

 [/^per 100 g/,'100 g'],[/^per portion/,'porcijai'],

 [/^Add to (\d{4}-\d{2}-\d{2})$/,'Pridėti į $1'],

 [/^Nothing was logged on (.+)\.$/,'$1 nieko neįrašyta.'],
 [/^Show all (\d+) entries$/,'Rodyti visus $1 įrašus'],[/^All (\d+) entries$/,'Visi $1 įrašai'],
 [/^(\d+) kcal and (\d[\d,.]*) g protein left\. Best protein per calorie:$/,'Liko $1 kcal ir $2 g baltymų. Daugiausia baltymų vienai kalorijai:'],

 [/^Entry copied to (.+)$/,'Įrašas nukopijuotas į $1'],

];
function ltText(t){
 var m=t.match(/^(\s*)([\s\S]*?)(\s*)$/),core=m[2];
 if(!core)return t;
 if(LT[core])return m[1]+LT[core]+m[3];
 for(var i=0;i<LT_RE.length;i++){if(LT_RE[i][0].test(core)&&LT_RE[i][1]!==''){return m[1]+core.replace(LT_RE[i][0],LT_RE[i][1])+m[3];}}
 return t;
}
function translateDom(root){
 if(db.lang!=='lt'||!root)return;
 var w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null),n,list=[];
 while((n=w.nextNode())){var pe=n.parentNode;if(pe&&pe.tagName!=='SCRIPT'&&pe.tagName!=='STYLE'&&!(pe.closest&&pe.closest('.main>b,.it,.ing,.wrow b')))list.push(n);}
 list.forEach(function(x){var v=ltText(x.nodeValue);if(v!==x.nodeValue)x.nodeValue=v;});
 root.querySelectorAll('[placeholder],[aria-label]').forEach(function(e){
  ['placeholder','aria-label'].forEach(function(a){var v=e.getAttribute(a);if(v&&LT[v])e.setAttribute(a,LT[v]);});
 });
}

 $('#fab').innerHTML=svg('plus',22)+(lt?LT['Add food']:'Add food');
 document.documentElement.lang=lt?'lt':'en';

}

 'sync-get':async function(){
  if(syncBusy)return;syncBusy=true;readSyncForm();syncMsg('Reading the sheet...',true);
  try{
   var data=await callSheet('getAll'),add=0,upd=0,today=todayStr();
   data.foods.forEach(function(x){
    var f=db.foods.find(function(y){return y.name.toLowerCase()===x.name.toLowerCase();});
    if(f){if(f.recipeId)return;f.unit='g';f.kcal=x.kcal;f.protein=x.protein;f.portionG=x.portionG;delete f.local;upd++;}
    else{db.foods.push({id:uid(),name:x.name,unit:'g',kcal:x.kcal,protein:x.protein,portionG:x.portionG});add++;}
   });
   var wn=0;
   data.weights.forEach(function(w){
    var x=db.weights.find(function(y){return y.date===w.date;});
    if(x)x.kg=r1(w.kg);else db.weights.push({date:w.date,kg:r1(w.kg)});
    wn++;
   });
   var dn=0;
   data.days.forEach(function(d){
    if(d.date>=today)return;
    if(db.entries.some(function(e){return e.date===d.date&&!e.imp;}))return;
    db.entries=db.entries.filter(function(e){return !(e.imp&&e.date===d.date);});
    if(!(d.kcal>0||d.protein>0))return;
    db.entries.push({id:uid(),date:d.date,name:'Day total from sheet',unit:'portion',k:d.kcal,p:d.protein,qty:1,kcal:d.kcal,protein:d.protein,t:0,imp:true});
    dn++;
   });
   db.entries=db.entries.filter(function(e){return !(e.src==='sheet'&&e.date===today);});
   var own={},tn=0;
   db.entries.forEach(function(e){if(e.date===today){var k=e.name.toLowerCase();own[k]=(own[k]||0)+1;}});
   data.today.forEach(function(it){
    var k=it.name.toLowerCase();
    if(own[k]>0){own[k]--;return;}
    db.entries.push({id:uid(),date:today,name:it.name,unit:it.unit,k:it.k,p:it.p,qty:it.qty>0?it.qty:1,kcal:r1(it.kcal),protein:r1(it.protein),t:Date.now()+tn,src:'sheet'});
    tn++;
   });
   save();render();
   syncMsg('Got '+(add+upd)+' foods ('+add+' new), '+wn+' weights, '+dn+' calendar days and '+tn+' meals for today.',true);
  }catch(e){syncMsg(syncError(e));}finally{syncBusy=false;}
 },
 'sync-send':async function(){
  readSyncForm();
  if(gs.since&&!/^\d{4}-\d{2}-\d{2}$/.test(gs.since)){syncMsg('Write the start date as YYYY-MM-DD.');return;}
  if(syncBusy)return;syncBusy=true;syncMsg('Sending...',true);
  try{
   var since=gs.since||quarterStart(),today=todayStr();
   var cand=db.foods.filter(function(f){return f.local&&!(f.recipeId||f.isRecipe);});
   var foods=cand.filter(function(f){return f.unit==='g';}).map(function(f){return{name:f.name,kcal:f.kcal,protein:f.protein,portionG:f.portionG>0?f.portionG:0};});
   var skipped=cand.length-foods.length;
   var tot=totalsByDate(),days=[];
   Object.keys(tot).forEach(function(d){if(d>=since)days.push({date:d,kcal:Math.round(tot[d].kcal),protein:r1(tot[d].protein)});});
   var ws=db.weights.filter(function(w){return w.date>=since;}).map(function(w){return{date:w.date,kg:w.kg};});
   var meals=db.entries.filter(function(e){return e.date===today&&!e.imp;}).sort(function(a,b){return a.t-b.t;}).map(function(e){return{name:e.name,qty:e.qty,unit:e.unit==='g'?'g':'vnt.'};});
   var r=await callSheet('pushAll',{foods:foods,days:days,weights:ws,today:meals});
   cand.forEach(function(f){if(f.unit==='g')delete f.local;});
   save();
   var msg='Sent '+r.foods.added+' new foods, '+r.days.updated+' days, '+(r.weights.added+r.weights.updated)+' weights and '+r.today.added+' new meals for today'+(r.today.updated?' ('+r.today.updated+' updated)':'')+'.';
   if(r.days.missing&&r.days.missing.length)msg+=' No row in Kalendorius for: '+r.days.missing.join(', ')+'.';
   if(r.today.unknown&&r.today.unknown.length)msg+=' Not in the product list, so not added to Dienos kcal: '+r.today.unknown.join(', ')+'.';
   if(r.today.full)msg+=' Dienos kcal has no free rows, '+r.today.full+' meal(s) not added.';
   if(skipped)msg+=' '+skipped+' food(s) skipped, they need values per 100 g.';
   syncMsg(msg,true);
  }catch(e){syncMsg(syncError(e));}finally{syncBusy=false;}
 },

 'recipe-scale':function(){
  syncRecipeForm();
  var s=ui.sheet,old=num(s.serv),nw=num($('#r-scale').value);
  if(!(old>0)){setErr('Enter how many portions the recipe makes first.');return;}
  if(!(nw>0&&nw<=1000)){setErr('Enter the new number of portions.');return;}
  var f=nw/old,before=JSON.stringify(s.items),bs=s.serv;
  s.items=s.items.map(function(i){
   var q=i.unit==='g'?Math.round(i.qty*f*10)/10:Math.round(i.qty*f*100)/100;
   if(!(q>0))q=i.qty;
   var c=calc(i.unit,i.k,i.p,q),o=Object.assign({},i,{qty:q,kcal:c.kcal,protein:c.protein});
   if(i.g>0)o.g=r1(i.g*q/i.qty);
   return o;
  });
  s.serv=String(r3(nw));
  renderSheet();
  toast('Recipe scaled to '+fmtP(nw)+(nw===1?' portion':' portions'),function(){var sh=ui.sheet;if(sh&&sh.type==='recipe'){sh.items=JSON.parse(before);sh.serv=bs;renderSheet();}});
 },
 'recipe-item-del':function(el){syncRecipeForm();ui.sheet.items.splice(Number(el.dataset.n),1);renderSheet();},
 'recipe-save':function(){
  syncRecipeForm();
  var s=ui.sheet,name=s.name.trim(),sv=num(s.serv),pw=String(s.pw||'').trim()===''?0:num(s.pw);
  if(!name){setErr('Give the recipe a name.');return;}
  if(!s.items.length){setErr('Add at least one ingredient.');return;}
  if(!(sv>0)){setErr('Enter how many portions the recipe makes.');return;}
  if(!(pw>=0)){setErr('Enter the portion weight in grams, or leave it empty.');return;}
  var tk=0,tp=0;s.items.forEach(function(i){tk+=i.kcal;tp+=i.protein;});
  var rec=s.id?db.recipes.find(function(x){return x.id===s.id;}):null;
  if(!rec){rec={id:uid()};db.recipes.push(rec);}
  rec.name=name;rec.servings=sv;rec.portionG=pw;rec.totalG=pw*sv;rec.items=s.items.map(function(i){return Object.assign({},i);});
  var food=db.foods.find(function(x){return x.id===rec.foodId;});
  if(!food){food={id:uid()};db.foods.push(food);rec.foodId=food.id;}
  food.name=name;food.recipeId=rec.id;
  if(pw>0){food.unit='g';food.kcal=r3(tk/(sv*pw)*100);food.protein=r3(tp/(sv*pw)*100);food.portionG=r3(pw);}
  else{food.unit='portion';food.kcal=r3(tk/sv);food.protein=r3(tp/sv);food.portionG=0;}
  save();closeSheet();render();toast('Recipe saved and added to Foods');
 },

  var s=ui.sheet;
  if(!s.confirmDel){s.confirmDel=true;el.textContent='Tap again to delete';return;}
  db.recipes=db.recipes.filter(function(x){return x.id!==s.id;});
  db.foods.forEach(function(f){if(f.recipeId===s.id)delete f.recipeId;});
  save();closeSheet();render();toast('Recipe deleted');
 },
 'range':function(el){ui.range=Number(el.dataset.v);render();},
 'import-run':function(){
  var r=importFoods($('#imp').value);
  if(!r.add&&!r.upd){setErr('No foods found. Copy the cells straight from Google Sheets (columns A to G) and paste again.');return;}
  save();closeSheet();render();
  toast('Imported '+(r.add+r.upd)+' foods: '+r.add+' new, '+r.upd+' updated');
 },
 'entry-save':function(){
  var s=ui.sheet,q=num($('#qty').value);
  if(!(q>0)||q>100000){setErr('Enter an amount greater than zero.');return;}
  if(s.purpose==='ingredient'){var ci=calc(s.food.unit,s.food.k,s.food.p,q);s.recipe.items.push({name:s.food.name,unit:s.food.unit,k:s.food.k,p:s.food.p,qty:q,kcal:ci.kcal,protein:ci.protein,g:(s.food.unit==='g'?q:(s.base&&s.base.pg>0?q*s.base.pg:0))});ui.sheet=s.recipe;renderSheet();return;}
  var c=calc(s.food.unit,s.food.k,s.food.p,q);
  if(s.entryId){var e=db.entries.find(function(x){return x.id===s.entryId;});if(e){e.qty=q;e.kcal=c.kcal;e.protein=c.protein;}}
  else db.entries.push({id:uid(),date:s.date,name:s.food.name,unit:s.food.unit,k:s.food.k,p:s.food.p,qty:q,kcal:c.kcal,protein:c.protein,t:Date.now()});
  save();closeSheet();render();
 },
 'entry-remove':function(){
  var i=db.entries.findIndex(function(x){return x.id===ui.sheet.entryId;});if(i<0)return;
  var removed=db.entries.splice(i,1)[0];save();closeSheet();render();
  toast('Entry removed',function(){db.entries.push(removed);save();render();});
 },
 'close-sheet':function(){
  var s=ui.sheet;
  if(s&&(s.type==='scan'||s.type==='quick')&&s.back){if(s.type==='scan')stopScan();ui.sheet=s.back;renderSheet();return;}
  if(s&&s.type==='food'&&s.back){ui.sheet=s.back;renderSheet();return;}
  if(s&&s.type==='entry'&&s.purpose==='ingredient'&&s.recipe){ui.sheet=s.recipe;renderSheet();return;}
  closeSheet();
 },
 'cal-prev':function(){ui.cal.m--;if(ui.cal.m<0){ui.cal.m=11;ui.cal.y--;}render();},
 'cal-next':function(){ui.cal.m++;if(ui.cal.m>11){ui.cal.m=0;ui.cal.y++;}render();},
 'open-day':function(el){ui.date=el.dataset.date;ui.tab='today';render();window.scrollTo(0,0);},
 'food-new':function(){newFood(null);},
 'food-new-from-entry':function(el){newFood(ui.sheet,el.dataset.name||'');},
 'food-edit':function(el){
  var f=db.foods.find(function(x){return x.id===el.dataset.id;});if(!f)return;
  ui.sheet={type:'food',id:f.id,name:f.name,unit:f.unit,kcal:String(f.kcal),protein:String(f.protein),pg:f.portionG?String(f.portionG):'',rec:!!(f.isRecipe||f.recipeId),lock:!!f.recipeId,fav:!!f.fav,back:null};renderSheet();
 },
 'basis':function(el){syncFoodForm();ui.sheet.unit=el.dataset.unit;renderSheet();},
 'food-save':function(){
  syncFoodForm();
  var s=ui.sheet,name=s.name.trim(),k=num(s.kcal),p=s.protein.trim()===''?0:num(s.protein);
  if(!name){setErr('Give the food a name.');return;}
  if(!(k>=0)){setErr('Enter calories as a number.');return;}
  if(!(p>=0)){setErr('Enter protein as a number, or leave it empty.');return;}
  var pgn=num(s.pg||'');
  if(s.unit==='g'&&String(s.pg||'').trim()!==''&&!(pgn>0)){setErr('Enter the portion size in grams, or leave it empty.');return;}
  var pgv=(s.unit==='g'&&pgn>0)?pgn:0;
  var f;
  if(s.id){f=db.foods.find(function(x){return x.id===s.id;});if(f){f.name=name;f.unit=s.unit;f.kcal=k;f.protein=p;f.portionG=pgv;}}
  else{f={id:uid(),name:name,unit:s.unit,kcal:k,protein:p,portionG:pgv,local:true};db.foods.push(f);}
  if(f&&!s.lock){if(s.rec)f.isRecipe=true;else delete f.isRecipe;}
  if(f){if(s.fav)f.fav=true;else delete f.fav;}
  save();
  if(s.back&&f){
   ui.sheet=Object.assign({},s.back,{base:{name:f.name,unit:f.unit,k:f.kcal,p:f.protein,pg:f.portionG||0},food:{name:f.name,unit:f.unit,k:f.kcal,p:f.protein},step:'qty',qty:f.unit==='g'?'100':'1'});renderSheet();
  }else closeSheet();
  render();
 },
 'food-del':function(el){
  var s=ui.sheet;
  if(!s.confirmDel){s.confirmDel=true;el.textContent='Tap again to delete';return;}
  db.foods=db.foods.filter(function(x){return x.id!==s.id;});save();closeSheet();render();toast('Food deleted');
 },
 'weight-add':function(){
  var date=$('#w-date').value||todayStr(),kg=num($('#w-kg').value);
  if(!(kg>=20&&kg<=400)){$('#w-err').textContent='Enter your weight in kg, for example 78.4';return;}
  var i=db.weights.findIndex(function(x){return x.date===date;});
  if(i>=0)db.weights[i].kg=r1(kg);else db.weights.push({date:date,kg:r1(kg)});
  save();render();toast('Weight saved');
 },
 'weight-del':function(el){
  var i=db.weights.findIndex(function(x){return x.date===el.dataset.date;});if(i<0)return;
  var removed=db.weights.splice(i,1)[0];save();render();
  toast('Weight removed',function(){db.weights.push(removed);save();render();});
 },
 'settings':function(){ui.sheet={type:'settings'};renderSheet();},
 'theme':function(el){db.theme=el.dataset.v;save();applyTheme();renderSheet();},
 'backup-copy':function(){
  var t=JSON.stringify(db),ta=$('#bk');ta.value=t;ta.focus();ta.select();
  try{navigator.clipboard.writeText(t).then(function(){setErr('Backup copied.',true);},function(){setErr('Select the text and copy it.',true);});}
  catch(e){setErr('Select the text and copy it.',true);}
 },
 'backup-restore':function(){
  try{
   var d=JSON.parse($('#bk').value);
   if(!d||!Array.isArray(d.foods)||!Array.isArray(d.entries))throw 0;
   db=normalize(d);save();applyTheme();render();renderSheet();setErr('Backup restored.',true);
  }catch(e){setErr('That text is not a valid backup.');}
 },
 'undo':function(){if(lastUndo){lastUndo();lastUndo=null;}$('#toast').classList.remove('show');}
};

document.addEventListener('click',function(e){
 var tab=e.target.closest('[data-tab]');
 if(tab){ui.tab=tab.dataset.tab;ui.sheet=null;renderSheet();render();window.scrollTo(0,0);return;}
 var el=e.target.closest('[data-act]');
 if(!el)return;
 var h=actions[el.dataset.act];if(h)h(el,e);
});
document.addEventListener('input',function(e){
 var t=e.target;
 if(t.id==='qty')updatePreview();
 else if(t.id==='i-kcal'){var v=num(t.value);if(v>=100&&v<=2000){ui.idea.target=v;refreshIdeas();}}
 else if(t.id==='r-serv'||t.id==='r-pw'){if(t.id==='r-serv'&&ui.sheet&&ui.sheet.type==='recipe')ui.sheet.servAuto=false;if(t.id==='r-pw')autoServings();updateRecipeSum();}
 else if(t.id==='pq')$('#pick-list').innerHTML=pickListHtml(t.value);
 else if(t.id==='fq'){ui.fq=t.value;$('#foods-list').innerHTML=foodsListHtml(ui.fq,'food-edit');}
});
document.addEventListener('change',function(e){
 var t=e.target;
 if(t.id==='rem-on'||t.id==='rem-time'||t.id==='rem-week'){applyReminder();return;}
  if(t.id==='w-date'){var tx=$('#w-date-txt');if(tx)tx.textContent=t.value||todayStr();return;}
  if(t.id==='pg-goal'||t.id==='pg-height'||t.id==='pg-start'){
  var raw=String(t.value).trim(),key=t.id==='pg-goal'?'goalW':t.id==='pg-height'?'height':'start';
  if(key==='start'){if(raw===''||/^\d{4}-\d{2}-\d{2}$/.test(raw))db.goals.start=raw;else{toast('Write the start date as YYYY-MM-DD.');return;}}
  else{var nv=num(raw);if(raw===''){delete db.goals[key];}else if(nv>0)db.goals[key]=nv;else{toast('Enter a number.');return;}}
  save();render();return;
 }
  if(t.id==='g-kcal'||t.id==='g-protein'||t.id==='g-maint'){
  var v=num(t.value);
  if(v>=0){db.goals[t.id==='g-kcal'?'kcal':t.id==='g-maint'?'maint':'protein']=v;save();render();setErr('Goal saved.',true);}
  else setErr('Enter a number.');
 }
});
document.addEventListener('keydown',function(e){
 if(e.key==='Escape'&&ui.menu){ui.menu=false;renderMenu();return;}
 if(e.key==='Escape'&&ui.sheet){closeSheet();return;}
 if(e.key==='Enter'){
  if(e.target.id==='qty')actions['entry-save']();
  else if(e.target.id==='w-kg')actions['weight-add']();
 }
});

/* ---------- android back button ---------- */
var lastBack=0;
function onBack(){
 if(ui.menu){actions['menu-close']();return;}
 if(ui.sheet){actions['close-sheet']();return;}
 if(ui.tab==='graph'){actions.back();return;}
 if(ui.tab!=='today'){ui.tab='today';render();window.scrollTo(0,0);return;}
 var n=Date.now();
 if(n-lastBack<2500){var A=window.Capacitor.Plugins.App;if(A&&A.exitApp)A.exitApp();return;}
 lastBack=n;toast('Press back again to close the app',2500);
}
try{
 var CA=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.App;
 if(CA&&CA.addListener)CA.addListener('backButton',onBack);
}catch(e){}
/* ---------- start ---------- */
buildNav();
applyTheme();save();render();
if(db.rem&&db.rem.on)scheduleReminder(true,db.rem.time,true);
if(db.rem&&db.rem.week)scheduleWeekly(true,true);
pushWidget();
})();
</script>
</body>
</html>
